<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jal Patel — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* --------------------------------------------------------------------------
       RESET & THEME TOKENS
       Palette: Deep Navy #0d1020, Cream #f4efe4, Lime #d6ff5c, Coral #ff6a55, Violet #8b7dff
       -------------------------------------------------------------------------- */
    :root {
      --bg: #0d1020;
      --cream: #f4efe4;
      --lime: #d6ff5c;
      --coral: #ff6a55;
      --violet: #8b7dff;
      --navy-card: #14182b;
      --navy-border: rgba(244, 239, 228, 0.12);
      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--cream);
      font-family: var(--font-sans);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* --------------------------------------------------------------------------
       LAYOUT GRID (Full Screen Desktop, Stacked Mobile)
       -------------------------------------------------------------------------- */
    .cover-container {
      width: 100%;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      padding: clamp(24px, 5vw, 64px);
      gap: clamp(32px, 5vw, 64px);
      max-width: 1440px;
      margin: 0 auto;
      position: relative;
    }

    /* Left Column: Content & Actions */
    .cover-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 2;
      max-width: 580px;
    }

    .cover-name {
      font-family: var(--font-display);
      font-size: clamp(48px, 6vw, 84px);
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: -0.035em;
      color: var(--cream);
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .cover-sentence {
      font-size: clamp(17px, 1.8vw, 21px);
      line-height: 1.55;
      color: var(--cream);
      opacity: 0.88;
      font-weight: 400;
      margin-bottom: 32px;
    }

    /* Interactive Skill Buttons */
    .skills-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .skill-btn {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--cream);
      background: rgba(244, 239, 228, 0.06);
      border: 1px solid var(--navy-border);
      padding: 11px 18px;
      border-radius: 999px;
      cursor: pointer;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.2, 0.7, 0.2, 1);
      user-select: none;
    }

    .skill-btn:hover {
      border-color: var(--violet);
      background: rgba(139, 125, 255, 0.12);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .skill-btn.is-active {
      background: rgba(139, 125, 255, 0.22);
      border-color: var(--violet);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(139, 125, 255, 0.35);
    }

    .skill-description-box {
      min-height: 28px;
      margin-bottom: 36px;
    }

    .skill-desc-text {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--violet);
      letter-spacing: 0.02em;
      transition: opacity 0.2s ease;
    }

    /* Actions Row */
    .action-row {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .enter-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background-color: var(--lime);
      color: var(--bg);
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-decoration: none;
      padding: 16px 36px;
      border-radius: 999px;
      min-height: 54px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0.7, 0.2, 1);
      box-shadow: 0 4px 24px rgba(214, 255, 92, 0.32);
      animation: buttonPulse 1.8s ease-in-out 0.8s 2;
    }

    .enter-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 32px rgba(214, 255, 92, 0.55);
    }

    .enter-btn__arrow {
      font-size: 19px;
      transition: transform 0.2s ease;
    }

    .enter-btn:hover .enter-btn__arrow {
      transform: translateX(4px);
    }

    .resume-link {
      color: var(--cream);
      font-family: var(--font-mono);
      font-size: 14px;
      text-decoration: none;
      opacity: 0.75;
      padding: 12px 14px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      transition: opacity 0.2s ease, color 0.2s ease;
    }

    .resume-link:hover {
      opacity: 1;
      color: var(--lime);
    }

    /* --------------------------------------------------------------------------
       RIGHT COLUMN: ILLUSTRATION (CALM DUSK & MARKET RIDGE SCENE)
       -------------------------------------------------------------------------- */
    .cover-illustration {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .dusk-svg {
      width: 100%;
      max-width: 620px;
      height: auto;
      display: block;
    }

    /* SVG Motion & Elements */
    .chart-ridge-line {
      stroke-dasharray: 1600;
      stroke-dashoffset: 1600;
      animation: drawChart 2.4s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    @keyframes drawChart {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes buttonPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 4px 24px rgba(214, 255, 92, 0.32);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 8px 36px rgba(214, 255, 92, 0.65);
      }
    }

    /* Interactive Highlight States for SVG */
    .art-highlight {
      transition: opacity 0.3s ease, stroke-width 0.3s ease, filter 0.3s ease;
    }

    .target-ai.is-highlighted {
      stroke: #ffffff;
      stroke-width: 2.2px;
      filter: drop-shadow(0 0 10px rgba(139, 125, 255, 0.8));
    }

    .target-markets.is-highlighted {
      stroke: #ffffff;
      stroke-width: 4px;
      filter: drop-shadow(0 0 12px rgba(214, 255, 92, 0.9));
    }

    .target-data.is-highlighted {
      opacity: 0.9 !important;
      fill: var(--lime) !important;
      filter: drop-shadow(0 0 8px rgba(214, 255, 92, 0.6));
    }

    .target-cloud.is-highlighted {
      stroke: var(--lime) !important;
      filter: drop-shadow(0 0 12px rgba(214, 255, 92, 0.7));
    }

    /* --------------------------------------------------------------------------
       MOBILE RESPONSIVENESS
       Mobile rule: illustration first (max 44% vh), then name, sentence, buttons, full-width lime button.
       -------------------------------------------------------------------------- */
    @media (max-width: 900px) {
      .cover-container {
        grid-template-columns: 1fr;
        padding: 24px 20px 48px;
        gap: 20px;
        align-items: start;
      }

      .cover-illustration {
        order: 1;
        max-height: 44vh;
        overflow: hidden;
        margin-bottom: 8px;
      }

      .dusk-svg {
        max-height: 44vh;
        width: auto;
      }

      .cover-content {
        order: 2;
        max-width: 100%;
      }

      .cover-name {
        font-size: clamp(38px, 11vw, 54px);
        margin-bottom: 12px;
      }

      .cover-sentence {
        font-size: 16px;
        margin-bottom: 24px;
      }

      .skills-group {
        margin-bottom: 12px;
      }

      .skill-btn {
        flex: 1 1 auto;
        font-size: 12px;
        padding: 10px 14px;
      }

      .skill-description-box {
        margin-bottom: 28px;
        min-height: 24px;
      }

      .action-row {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .enter-btn {
        width: 100%;
        min-height: 52px;
      }

      .resume-link {
        justify-content: center;
        width: 100%;
        text-align: center;
      }
    }

    /* --------------------------------------------------------------------------
       REDUCED MOTION PREFERENCE
       -------------------------------------------------------------------------- */
    @media (prefers-reduced-motion: reduce) {
      .chart-ridge-line {
        stroke-dashoffset: 0 !important;
        animation: none !important;
      }
      .enter-btn {
        animation: none !important;
      }
      * {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

    <section class="cover-content" aria-label="Introduction">
      <h1 class="cover-name">JAL PATEL</h1>

          Market Signals

  </main>

  <script>
    (function () {
      'use strict';

      const buttons = document.querySelectorAll('.skill-btn');
      const descEl = document.getElementById('skill-desc');

      function activateSkill(btn) {
        const target = btn.dataset.skill;
        const desc = btn.dataset.desc;

        buttons.forEach(function (b) {
          b.classList.toggle('is-active', b === btn);
          b.setAttribute('aria-pressed', String(b === btn));
        });

        if (descEl) {
          descEl.style.opacity = '0';
          setTimeout(function () {
            descEl.textContent = desc;
            descEl.style.opacity = '1';
          }, 150);
        }

        // Highlight matching elements in the inline SVG
        document.querySelectorAll('.art-highlight').forEach(function (el) {
          el.classList.remove('is-highlighted');
        });

        const targets = document.querySelectorAll('.target-' + target);
        targets.forEach(function (el) {
          el.classList.add('is-highlighted');
        });
      }

      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          activateSkill(btn);
        });

        btn.addEventListener('mouseenter', function () {
          activateSkill(btn);
        });
      });

      // Default activation
      const initialBtn = document.querySelector('.skill-btn.is-active') || buttons[0];
      if (initialBtn) activateSkill(initialBtn);
    }());
  </script>
</body>
